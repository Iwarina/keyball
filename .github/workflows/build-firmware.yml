name: Build a firmware

on:

  workflow_call:
    inputs:
      qmk_version:
        default: '0.22.14'
        type: string
        required: false
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:

  build:

    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli:latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Checkout qmk_firmware
      uses: ./.github/actions/checkout-qmk_firmware

    - name: Install a link to own source
      run: ln -s $(pwd)/qmk_firmware/keyboards/keyball __qmk__/keyboards/keyball

    - name: Install missing python modules
      run: /opt/uv/tools/qmk/bin/python3 -m pip install -r __qmk__/requirements.txt

    - name: Patch QMK for Python 3.14
      run: |
        /opt/uv/tools/qmk/bin/python3 - <<'PY'
        from pathlib import Path

        path = Path("__qmk__/lib/python/qmk/math.py")
        text = path.read_text()
        text = text.replace(
            "if isinstance(node, ast.Num):  # <number>\n        return node.n",
            "if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)):  # <number>\n        return node.value",
        )
        path.write_text(text)

        path = Path("__qmk__/quantum/dynamic_keymap.c")
        text = path.read_text()
        text = text.replace(
            '_Static_assert((DYNAMIC_KEYMAP_EEPROM_MAX_ADDR) - (DYNAMIC_KEYMAP_MACRO_EEPROM_ADDR) >= 100, "Dynamic keymaps are configured to use more EEPROM than is available.");',
            '#if DYNAMIC_KEYMAP_MACRO_COUNT > 0\n_Static_assert((DYNAMIC_KEYMAP_EEPROM_MAX_ADDR) - (DYNAMIC_KEYMAP_MACRO_EEPROM_ADDR) >= 100, "Dynamic keymaps are configured to use more EEPROM than is available.");\n#endif',
        )
        path.write_text(text)
        PY

    - name: Compile and link
      run: qmk compile -j 4 -kb keyball/${{ inputs.keyboard }} -km ${{ inputs.keymap }}

    - name: Archive built firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: __qmk__/*.hex
